<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
    * {
        box-sizing: border-box;
    }
    body{
        font-family:Arial,sans-serif;
        padding-right: 5%;
        padding-left: 10%;
    }
    .row::after {
        content: "";
        clear: both;
        display: table;
    }
    .progress {
        width: 16.66%;
        float: left;
        padding: 15px;
        margin: 1%;
        height: auto;
        background-size: 100% 100%;
        text-align: center;
    }
    .progress:before {
        content: "";
	    display: block;
	    padding-top: 100%;
    }
    .dummy{
        float: left;
        height: 300vh;
        width: 25%;
        padding-top: 7%;
        position: relative;
    }

    .description {
        margin-top: -120%;
        display: inline-block;
        vertical-align: middle;
        color: rgb(25,66,114);
    }
</style>
</head>
<body>
<div class="dummy"></div>

<div class="row">
{% for c,s in new_dictionary.items %}
    <div class="progress" id="circle_{{ forloop.counter }}" score="{{ s }}">
        <span class="description"><b>{{ c }}</b></span>
    </div>
{% endfor %}
</div>

<script>
    document.addEventListener("DOMContentLoaded",function()
    {
        start();
    });

    function start()
    {
        // Fill in the progress circles with corresponding background png
        var circles = document.getElementsByClassName("progress");
        // Sum is required to calculate the whole progress on the current rang
        var sum = 0;
        for(var i=0; i<circles.length; i++)
        {
            var step = Math.floor(circles[i].getAttribute("score")/10);
            sum += step;
            var style = document.createElement("style");
            document.head.appendChild(style);
            sheet = style.sheet;
            sheet.insertRule('#circle_'+(i+1)+'{background-image: url("./static/images/Name_'+step+'.png");}', 0);
        }

    }

</script>
</body>
</html>
